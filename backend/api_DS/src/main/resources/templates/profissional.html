<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Profissionais</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}" href="/css/clientes.css">
</head>

<body>
<main class="container">
    <header class="cabecalho">
        <div>
            <p class="eyebrow">SPRING BOOT + THYMELEAF</p>
            <h1>Cadastro de profissionais</h1>
        </div>
        <a class="botao principal btn-extra" th:href="@{/profissionais/novo}" href="/profissionais/novo">
            + Novo profissional
        </a>
    </header>

    <nav>
        <a class="link botao secundario" href="./">Agendamentos</a>
    </nav>

    <div class="aviso sucesso" role="status" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="aviso falha" role="alert" th:if="${erro}" th:text="${erro}"></div>

    <section class="painel">
        <div class="barra">
            <div>
                <h2>Profissionais cadastrados</h2>
                <p><span th:text="${#lists.size(profissionais)}">0</span> registro(s)</p>
            </div>
        </div>

        <div class="tabela-rolagem">
            <table aria-label="Profissionais cadastrados">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Especialidade</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="profissional : ${profissionais}">
                    <td th:text="${profissional.profissionalId}">1</td>
                    <td class="destaque" th:text="${profissional.profissionalNome}">Nome</td>
                    <td th:text="${profissional.profissionalEspecialidade}">Especialidade</td>
                    <td th:text="${profissional.profissionalTelefone}">Telefone</td>
                    <td th:text="${profissional.profissionalEmail}">email@exemplo.com</td>
                    <td class="acoes">
                        <a class="link"
                           th:href="@{/profissionais/editar/{id}(id=${profissional.profissionalId})}">Editar</a>
                        <form method="post"
                              th:action="@{/profissionais/excluir/{id}(id=${profissional.profissionalId})}"
                              onsubmit="return confirm('Excluir este profissional?');">
                            <button class="link perigo" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <p class="vazio mensagem-sem-registros" th:if="${#lists.isEmpty(profissionais)}">
                Nenhum profissional encontrado.
            </p>
        </div>
    </section>
</main>
</body>
</html>
