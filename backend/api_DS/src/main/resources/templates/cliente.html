<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}" href="/css/clientes.css">
</head>

<body class="clientes">
<main class="container">
    <header class="cabecalho">
        <div>
            <p class="eyebrow">SPRING BOOT + THYMELEAF</p>
            <h1>Cadastro de clientes</h1>
        </div>
        <a class="botao principal btn-extra" href="/clientes/novo">
            + Novo cliente
        </a>
    </header>

    <nav>
        <a class="link botao secundario" href="./">Agendamentos</a>
    </nav>

    <div class="aviso sucesso" role="status" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="aviso falha" role="alert" th:if="${erro}" th:text="${erro}"></div>

    <section class="painel">
        <div class="barra">
            <div>
                <h2>Clientes cadastrados</h2>
                <p><span th:text="${#lists.size(clientes)}">0</span> registro(s)</p>
            </div>
        </div>

        <div class="tabela-rolagem">
            <table aria-label="Clientes cadastrados">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>CPF</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.clienteId}">1</td>
                    <td class="destaque" th:text="${cliente.clienteNome}">Nome</td>
                    <td th:text="${cliente.clienteEmail}">email@exemplo.com</td>
                    <td th:text="${cliente.clienteTelefone}">Telefone</td>
                    <td th:text="${cliente.clienteCpf}">CPF</td>
                    <td class="acoes">
                        <a class="link" th:href="@{/clientes/editar/{id}(id=${cliente.clienteId})}">Editar</a>
                        <form method="post" th:action="@{/clientes/excluir/{id}(id=${cliente.clienteId})}"
                              onsubmit="return confirm('Excluir este cliente?');">
                            <button class="link perigo" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <p class="vazio mensagem-sem-registros" th:if="${#lists.isEmpty(clientes)}">
                Nenhum cliente encontrado.
            </p>
        </div>
    </section>
</main>
</body>
</html>
