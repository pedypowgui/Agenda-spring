spring.application.name=api

spring.datasource.url=jdbc:mysql://localhost:3306/consumoapi?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create or updates tables without deleting everything upon each execution
spring.jpa.hibernate.ddl-auto=update
# Shows SQL commands on CLI
spring.jpa.show-sql=true
# Sorts SQL commands, to facilitate reading
spring.jpa.properties.hibernate.format_sql=true